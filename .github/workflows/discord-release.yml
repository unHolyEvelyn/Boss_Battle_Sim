name: Discord Release Thread

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual triggers for testing

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Dynamic Release Webhook to Discord
        run: |
          # 1. Grab release metadata or fallback defaults for manual triggers
          TAG_NAME="${{ github.event.release.tag_name }}"
          RELEASE_TITLE="${{ github.event.release.name }}"
          RELEASE_URL="${{ github.event.release.html_url }}"
          RELEASE_BODY="${{ github.event.release.body }}"

          # Defaults if triggered manually without release event payload
          if [ -z "$TAG_NAME" ]; then TAG_NAME="v1.3.0"; fi
          if [ -z "$RELEASE_TITLE" ]; then RELEASE_TITLE="Boss Fight Simulator $TAG_NAME"; fi
          if [ -z "$RELEASE_URL" ]; then RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"; fi
          if [ -z "$RELEASE_BODY" ]; then RELEASE_BODY="New update published! Check out the GitHub release page for full patch details."; fi

          # 2. Format the forum thread title and message content
          THREAD_NAME="$RELEASE_TITLE Discussion"
          MESSAGE_CONTENT="🚀 **New Release Published: $TAG_NAME!**\n\n$RELEASE_BODY\n\n🔗 **Release Page:** $RELEASE_URL"

          # 3. Construct JSON safely using jq to handle special characters/newlines
          PAYLOAD=$(jq -n \
            --arg tn "$THREAD_NAME" \
            --arg msg "$MESSAGE_CONTENT" \
            '{thread_name: $tn, content: $msg}')

          # 4. POST payload to Discord Forum webhook
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "${{ secrets.DISCORD_WEBHOOK }}?wait=true"
