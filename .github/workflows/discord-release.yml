name: Discord Release Thread

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Webhook to Discord
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                     "thread_name": "Boss Fight Simulator v1.3.0 Discussion",
                     "content": "🚀 **Boss Fight Simulator v1.3.0 Published!**\n\nCheck out the release notes on GitHub!"
                   }' \
               "${{ secrets.DISCORD_WEBHOOK }}?wait=true"
